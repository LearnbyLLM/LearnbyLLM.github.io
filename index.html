<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnbyLLM — Interactive Learning Tools</title>
  <meta name="description"
    content="Interactive visualizations and guides for understanding complex concepts — LLMs, transformers, data structures, agents, and more.">

  <!-- Open Graph / social sharing -->
  <meta property="og:title" content="LearnbyLLM — Interactive Learning Tools">
  <meta property="og:description"
    content="Interactive visualizations and guides for understanding complex concepts — LLMs, transformers, data structures, agents, and more.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://learnbyllm.github.io/">
  <meta property="og:image" content="https://learnbyllm.github.io/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Set theme before paint to avoid a flash of the wrong theme -->
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  </script>

  <style>
    :root,
    [data-theme="dark"] {
      --bg: #0a0a0c;
      --bg-hover: #121216;
      --border: #232329;
      --border-strong: #3a3a42;
      --text: #ededf0;
      --text-secondary: #9b9ba4;
      --text-tertiary: #62626c;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.09);
    }

    [data-theme="light"] {
      --bg: #fbfbfa;
      --bg-hover: #f3f3f1;
      --border: #e6e6e2;
      --border-strong: #cfcfc9;
      --text: #1a1a1c;
      --text-secondary: #57575e;
      --text-tertiary: #9a9aa0;
      --accent: #0284c7;
      --accent-soft: rgba(2, 132, 199, 0.07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'IBM Plex Mono', 'Consolas', monospace;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 64px;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 26px 0;
      margin-bottom: 64px;
    }

    .wordmark {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .wordmark::before {
      content: '~/';
      color: var(--text-tertiary);
    }

    .wordmark::after {
      content: '_';
      color: var(--accent);
      animation: blink 1.2s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .theme-toggle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      border: none;
      background: none;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.15s ease;
    }

    .theme-toggle:hover {
      color: var(--accent);
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.2;
      margin-bottom: 18px;
      max-width: 600px;
    }

    h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 56px;
      max-width: 540px;
    }

    /* ---------- search + filters ---------- */
    .toolbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-strong);
      padding-bottom: 14px;
      margin-bottom: 0;
    }

    .tag-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .tag-chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      cursor: pointer;
      user-select: none;
      padding: 2px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.15s ease;
    }

    .tag-chip:hover {
      color: var(--text);
    }

    .tag-chip.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .search-wrap {
      flex: 1;
      min-width: 180px;
      max-width: 240px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .search-wrap::before {
      content: '/';
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-tertiary);
      font-size: 0.8rem;
    }

    #searchInput {
      width: 100%;
      border: none;
      background: none;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      outline: none;
      padding: 2px 0;
    }

    #searchInput::placeholder {
      color: var(--text-tertiary);
    }

    /* ---------- index list ---------- */
    .tools-list {
      margin-bottom: 80px;
    }

    .tool-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 8px 20px;
      align-items: baseline;
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      position: relative;
      transition: background 0.15s ease;
    }

    .tool-row:hover {
      background: linear-gradient(90deg, transparent, var(--accent-soft) 8%, var(--accent-soft) 92%, transparent);
    }

    .tool-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-tertiary);
      transition: color 0.15s ease;
    }

    .tool-row:hover .tool-num {
      color: var(--accent);
    }

    .tool-main {
      min-width: 0;
    }

    .tool-name {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      display: inline-block;
      margin-bottom: 5px;
    }

    .tool-row:hover .tool-name::after {
      content: ' →';
      color: var(--accent);
    }

    .tool-description {
      color: var(--text-secondary);
      font-size: 0.88rem;
      line-height: 1.6;
      max-width: 460px;
    }

    .tool-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      text-align: right;
    }

    .tool-tags {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
    }

    .tool-type {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 3px;
    }

    /* ---------- what's new ---------- */
    .section-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.76rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      border-bottom: 1px solid var(--border-strong);
      padding-bottom: 14px;
      margin-bottom: 0;
    }

    .whats-new {
      margin-bottom: 80px;
    }

    .whats-new-item {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      line-height: 1.6;
      align-items: baseline;
    }

    .whats-new-date {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-tertiary);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .whats-new-text {
      color: var(--text-secondary);
    }

    .whats-new-text strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ---------- states ---------- */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
    }

    .error {
      text-align: center;
      padding: 40px;
      color: #ef4444;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
    }

    .empty-state {
      text-align: center;
      padding: 50px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
    }

    footer {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-tertiary);
      font-size: 0.74rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
    }

    @media (max-width: 640px) {
      .topbar {
        margin-bottom: 44px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .tool-row {
        grid-template-columns: 40px 1fr;
      }

      .tool-side {
        grid-column: 2;
        flex-direction: row;
        align-items: baseline;
        gap: 12px;
      }

      .whats-new-item {
        grid-template-columns: 40px 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <nav class="topbar">
      <a href="/" class="wordmark">learnbyllm</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">[theme]</button>
    </nav>

    <header>
      <h1>An index of interactive tools for learning <em>hard things</em>.</h1>
      <p class="subtitle">Visual, hands-on explanations of language models, data structures, agents,
        and more. No installs, no sign-ups — everything runs in your browser.</p>
    </header>

    <div class="toolbar">
      <div class="tag-filters" id="tagFilters"></div>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="search" oninput="filterTools()">
      </div>
    </div>

    <div class="tools-list" id="toolsGrid">
      <div class="loading">loading index…</div>
    </div>

    <h2 class="section-title">Changelog</h2>
    <div class="whats-new" id="whatsNew"></div>

    <footer>
      <p><span id="toolCount">–</span> tools · updated <span id="lastUpdated">–</span></p>
      <p><a href="https://github.com/LearnbyLLM/LearnbyLLM.github.io" target="_blank" rel="noopener">github ↗</a></p>
    </footer>
  </div>

  <script>
    // =============================================
    // CONFIGURATION
    // =============================================
    const GITHUB_USERNAME = 'LearnbyLLM';
    const GITHUB_REPO = 'LearnbyLLM.github.io';
    const TOOLS_FOLDER = 'tools';
    // =============================================

    // Tool metadata - add descriptions for your tools.
    // Keys should match filenames (without .html) or directory names.
    // `name` overrides the auto-generated display name.
    const toolMetadata = {
      'data-structures': {
        description: 'Interactive explanations of arrays, stacks, queues, trees, heaps, graphs, and more.',
        tags: ['CS Fundamentals']
      },
      'blockchain': {
        description: 'How blockchains work — hashing, blocks, mining, and consensus, explained interactively.',
        tags: ['CS Fundamentals']
      },
      'llm-intuition': {
        name: 'LLM Intuition',
        description: 'Understand how Large Language Models work through interactive visualizations.',
        tags: ['AI']
      },
      'transformer-explorer': {
        description: 'Step inside a transformer — tokenization, embeddings, attention, and next-token prediction, visualized.',
        tags: ['AI']
      },
      'notebooklm-guide': {
        name: 'NotebookLM Guide',
        description: 'A practical guide to using Google\'s NotebookLM for investment research — prompts, workflows, and limitations.',
        tags: ['AI', 'Finance', 'Guide']
      },
      'agentic-frameworks-guide': {
        description: 'Build multi-agent systems using Claude Code\'s native features — subagents, hooks, skills, and CLAUDE.md.',
        tags: ['AI', 'Guide']
      },
    };

    // Default metadata for tools without custom info
    const defaultMeta = {
      description: 'An interactive learning tool.',
      tags: []
    };

    // Newest first. Keep this list short — only the latest few entries show.
    const whatsNew = [
      { date: '2026-06-10', text: '<strong>Site redesign</strong> — a cleaner, minimal look with light and dark themes.' },
      { date: '2026-06-10', text: 'New tool: <strong>Transformer Explorer</strong> — tokenization, attention, and next-token sampling, visualized step by step.' },
      { date: '2026-06-10', text: '<strong>Browse by tag</strong> — filter tools by AI, CS Fundamentals, Finance, and Guides.' },
    ];
    const WHATS_NEW_LIMIT = 4;

    let allTools = [];
    let activeTag = 'All';

    // ---------- theme ----------
    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
    });

    // ---------- data loading ----------
    // Load the tool list from the static tools.json (generated by a GitHub
    // Action — fast, no rate limits). Falls back to the GitHub API if the
    // file is missing.
    async function fetchTools() {
      const grid = document.getElementById('toolsGrid');

      try {
        let files;

        try {
          const response = await fetch('tools.json', { cache: 'no-cache' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          files = data.tools;
          setLastUpdated(data.generated);
        } catch (staticError) {
          console.warn('tools.json unavailable, falling back to GitHub API:', staticError);
          const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${TOOLS_FOLDER}`;
          const response = await fetch(apiUrl);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          files = await response.json();
          fetchLastUpdate();
        }

        // Include HTML files and directories (guide-style tools)
        allTools = files
          .filter(file => file.name.endsWith('.html') || file.type === 'dir')
          .filter(file => file.name !== '.gitkeep')
          .map(file => {
            const isDir = file.type === 'dir';
            const key = isDir ? file.name : file.name.replace('.html', '');
            const displayName = key
              .split('-')
              .map(word => word.charAt(0).toUpperCase() + word.slice(1))
              .join(' ');

            const meta = toolMetadata[key] || defaultMeta;

            return {
              type: isDir ? 'guide' : 'interactive',
              path: isDir ? `${TOOLS_FOLDER}/${file.name}/` : `${TOOLS_FOLDER}/${file.name}`,
              name: displayName,
              ...meta // metadata may override the auto-generated name
            };
          });

        document.getElementById('toolCount').textContent = allTools.length;

        renderTagFilters();
        filterTools();

      } catch (error) {
        console.error('Error fetching tools:', error);
        grid.innerHTML = `<div class="error">couldn't load the tool index — try refreshing</div>`;
      }
    }

    function setLastUpdated(isoDate) {
      if (!isoDate) return;
      const date = new Date(isoDate);
      const options = { month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('lastUpdated').textContent = date.toLocaleDateString('en-US', options);
    }

    async function fetchLastUpdate() {
      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits?per_page=1`;
        const response = await fetch(apiUrl);
        const commits = await response.json();

        if (commits.length > 0) {
          setLastUpdated(commits[0].commit.committer.date);
        }
      } catch (error) {
        console.error('Error fetching last update:', error);
      }
    }

    // ---------- rendering ----------
    function renderTagFilters() {
      const tags = [...new Set(allTools.flatMap(tool => tool.tags || []))].sort();
      if (tags.length === 0) return;

      const container = document.getElementById('tagFilters');
      container.innerHTML = ['All', ...tags].map(tag => `
                <span class="tag-chip${tag === activeTag ? ' active' : ''}" data-tag="${tag}">${tag}</span>
            `).join('');

      container.querySelectorAll('.tag-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          activeTag = chip.dataset.tag;
          container.querySelectorAll('.tag-chip').forEach(c =>
            c.classList.toggle('active', c.dataset.tag === activeTag));
          filterTools();
        });
      });
    }

    function renderTools(tools) {
      const grid = document.getElementById('toolsGrid');

      if (tools.length === 0) {
        grid.innerHTML = `<div class="empty-state">nothing matches — try a different search</div>`;
        return;
      }

      grid.innerHTML = tools.map((tool, i) => `
                <a href="${tool.path}" class="tool-row">
                    <span class="tool-num">${String(i + 1).padStart(2, '0')}</span>
                    <div class="tool-main">
                        <span class="tool-name">${tool.name}</span>
                        <div class="tool-description">${tool.description}</div>
                    </div>
                    <div class="tool-side">
                        <span class="tool-type">${tool.type}</span>
                        <span class="tool-tags">${(tool.tags || []).join(' · ')}</span>
                    </div>
                </a>
            `).join('');
    }

    function renderWhatsNew() {
      const container = document.getElementById('whatsNew');
      container.innerHTML = whatsNew.slice(0, WHATS_NEW_LIMIT).map(item => {
        const date = new Date(item.date + 'T00:00:00');
        const label = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toLowerCase();
        return `
                <div class="whats-new-item">
                    <span class="whats-new-date">${label}</span>
                    <span class="whats-new-text">${item.text}</span>
                </div>`;
      }).join('');
    }

    function filterTools() {
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allTools.filter(tool =>
        (activeTag === 'All' || (tool.tags || []).includes(activeTag)) &&
        (tool.name.toLowerCase().includes(query) ||
          tool.description.toLowerCase().includes(query))
      );

      renderTools(filtered);
    }

    // Keyboard shortcut for search
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        document.getElementById('searchInput').value = '';
        filterTools();
        document.getElementById('searchInput').blur();
      }
    });

    // Initialize
    fetchTools();
    renderWhatsNew();
  </script>
</body>

</html>
