<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnbyLLM — Interactive Learning Tools</title>
  <meta name="description"
    content="Interactive visualizations and guides for understanding complex concepts — LLMs, transformers, data structures, agents, and more.">

  <!-- Open Graph / social sharing -->
  <meta property="og:title" content="LearnbyLLM — Interactive Learning Tools">
  <meta property="og:description"
    content="Interactive visualizations and guides for understanding complex concepts — LLMs, transformers, data structures, agents, and more.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://learnbyllm.github.io/">
  <meta property="og:image" content="https://learnbyllm.github.io/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Set theme before paint to avoid a flash of the wrong theme -->
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  </script>

  <style>
    :root,
    [data-theme="dark"] {
      --bg: #0a0a0c;
      --bg-elevated: #131316;
      --bg-hover: #18181c;
      --border: #232329;
      --border-strong: #34343c;
      --text: #ededf0;
      --text-secondary: #9b9ba4;
      --text-tertiary: #62626c;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.09);
      --accent-border: rgba(56, 189, 248, 0.35);
    }

    [data-theme="light"] {
      --bg: #fafafa;
      --bg-elevated: #ffffff;
      --bg-hover: #f4f4f5;
      --border: #e4e4e7;
      --border-strong: #d4d4d8;
      --text: #18181b;
      --text-secondary: #52525b;
      --text-tertiary: #a1a1aa;
      --accent: #0284c7;
      --accent-soft: rgba(2, 132, 199, 0.07);
      --accent-border: rgba(2, 132, 199, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0;
      margin-bottom: 48px;
    }

    .wordmark {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }

    .wordmark span {
      color: var(--accent);
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 650;
      letter-spacing: -0.025em;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 36px;
      max-width: 560px;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    #searchInput {
      width: 100%;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    #searchInput:focus {
      border-color: var(--accent-border);
    }

    #searchInput::placeholder {
      color: var(--text-tertiary);
    }

    .tag-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-chip {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 50px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .tag-chip:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .tag-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
      font-weight: 550;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 56px;
    }

    .tool-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s ease, background 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-card:hover {
      border-color: var(--border-strong);
      background: var(--bg-hover);
    }

    .tool-card-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tool-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      background: var(--accent-soft);
      flex-shrink: 0;
    }

    .tool-name {
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .tool-description {
      color: var(--text-secondary);
      font-size: 0.86rem;
      line-height: 1.55;
      flex: 1;
    }

    .tool-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tool-tag {
      font-size: 0.7rem;
      padding: 2px 9px;
      border-radius: 50px;
      border: 1px solid var(--border);
      color: var(--text-tertiary);
    }

    .tool-type {
      font-size: 0.72rem;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: 16px;
    }

    .whats-new {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-elevated);
      padding: 6px 20px;
      margin-bottom: 56px;
    }

    .whats-new-item {
      display: flex;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .whats-new-item:last-child {
      border-bottom: none;
    }

    .whats-new-date {
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 0.82rem;
      padding-top: 1px;
    }

    .whats-new-text {
      color: var(--text-secondary);
    }

    .whats-new-text strong {
      color: var(--text);
      font-weight: 600;
    }

    .stats-line {
      color: var(--text-tertiary);
      font-size: 0.82rem;
      margin-bottom: 28px;
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px;
      color: var(--text-tertiary);
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: var(--text-tertiary);
    }

    footer {
      padding-top: 28px;
      border-top: 1px solid var(--border);
      color: var(--text-tertiary);
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }

      .tools-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        margin-bottom: 32px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <nav class="topbar">
      <a href="/" class="wordmark">Learn<span>by</span>LLM</a>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </nav>

    <header>
      <h1>Interactive learning tools</h1>
      <p class="subtitle">Visualizations and guides for understanding complex concepts — language models,
        data structures, agents, and more. No installs, everything runs in your browser.</p>
    </header>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search tools…  ( / )" oninput="filterTools()">
      <div class="tag-filters" id="tagFilters"></div>
    </div>

    <div class="tools-grid" id="toolsGrid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading tools…</p>
      </div>
    </div>

    <section>
      <h2 class="section-title">What's new</h2>
      <div class="whats-new" id="whatsNew"></div>
    </section>

    <footer>
      <p><span id="toolCount">–</span> tools · updated <span id="lastUpdated">–</span></p>
      <p><a href="https://github.com/LearnbyLLM/LearnbyLLM.github.io" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </div>

  <script>
    // =============================================
    // CONFIGURATION
    // =============================================
    const GITHUB_USERNAME = 'LearnbyLLM';
    const GITHUB_REPO = 'LearnbyLLM.github.io';
    const TOOLS_FOLDER = 'tools';
    // =============================================

    // Tool metadata - add descriptions and icons for your tools
    // Keys should match filenames (without .html) or directory names
    const toolMetadata = {
      'data-structures': {
        icon: '📊',
        description: 'Interactive explanations of arrays, stacks, queues, trees, heaps, graphs, and more.',
        tags: ['CS Fundamentals']
      },
      'blockchain': {
        icon: '⛓️',
        description: 'How blockchains work — hashing, blocks, mining, and consensus, explained interactively.',
        tags: ['CS Fundamentals']
      },
      'llm-intuition': {
        name: 'LLM Intuition',
        icon: '🧠',
        description: 'Understand how Large Language Models work through interactive visualizations.',
        tags: ['AI']
      },
      'transformer-explorer': {
        icon: '🔬',
        description: 'Step inside a transformer — tokenization, embeddings, attention, and next-token prediction, visualized.',
        tags: ['AI']
      },
      'notebooklm-guide': {
        name: 'NotebookLM Guide',
        icon: '📓',
        description: 'A practical guide to using Google\'s NotebookLM for investment research — prompts, workflows, and limitations.',
        tags: ['AI', 'Finance', 'Guide']
      },
      'agentic-frameworks-guide': {
        icon: '🤖',
        description: 'Build multi-agent systems using Claude Code\'s native features — subagents, hooks, skills, and CLAUDE.md.',
        tags: ['AI', 'Guide']
      },
    };

    // Default metadata for tools without custom info
    const defaultMeta = {
      icon: '📚',
      description: 'An interactive learning tool.',
      tags: []
    };

    // Newest first. Keep this list short — only the latest few entries show.
    const whatsNew = [
      { date: '2026-06-10', text: '<strong>Site redesign</strong> — a cleaner, minimal look with light and dark themes.' },
      { date: '2026-06-10', text: 'New tool: <strong>Transformer Explorer</strong> — tokenization, attention, and next-token sampling, visualized step by step.' },
      { date: '2026-06-10', text: '<strong>Browse by tag</strong> — filter tools by AI, CS Fundamentals, Finance, and Guides.' },
    ];
    const WHATS_NEW_LIMIT = 4;

    let allTools = [];
    let activeTag = 'All';

    // ---------- theme ----------
    const themeToggle = document.getElementById('themeToggle');

    function applyThemeIcon() {
      themeToggle.textContent = document.documentElement.dataset.theme === 'light' ? '☾' : '☀';
    }

    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
      applyThemeIcon();
    });

    applyThemeIcon();

    // ---------- data loading ----------
    // Load the tool list from the static tools.json (generated by a GitHub
    // Action — fast, no rate limits). Falls back to the GitHub API if the
    // file is missing.
    async function fetchTools() {
      const grid = document.getElementById('toolsGrid');

      try {
        let files;

        try {
          const response = await fetch('tools.json', { cache: 'no-cache' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          files = data.tools;
          setLastUpdated(data.generated);
        } catch (staticError) {
          console.warn('tools.json unavailable, falling back to GitHub API:', staticError);
          const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${TOOLS_FOLDER}`;
          const response = await fetch(apiUrl);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          files = await response.json();
          fetchLastUpdate();
        }

        // Include HTML files and directories (guide-style tools)
        allTools = files
          .filter(file => file.name.endsWith('.html') || file.type === 'dir')
          .filter(file => file.name !== '.gitkeep')
          .map(file => {
            const isDir = file.type === 'dir';
            const key = isDir ? file.name : file.name.replace('.html', '');
            const displayName = key
              .split('-')
              .map(word => word.charAt(0).toUpperCase() + word.slice(1))
              .join(' ');

            const meta = toolMetadata[key] || defaultMeta;

            return {
              type: isDir ? 'Guide' : 'Interactive',
              path: isDir ? `${TOOLS_FOLDER}/${file.name}/` : `${TOOLS_FOLDER}/${file.name}`,
              name: displayName,
              ...meta // metadata may override the auto-generated name
            };
          });

        document.getElementById('toolCount').textContent = allTools.length;

        renderTagFilters();
        filterTools();

      } catch (error) {
        console.error('Error fetching tools:', error);
        grid.innerHTML = `
                    <div class="error">
                        <h3>Couldn't load tools</h3>
                        <p style="margin-top: 8px;">Looking for: ${GITHUB_USERNAME}/${GITHUB_REPO}/${TOOLS_FOLDER}</p>
                    </div>
                `;
      }
    }

    function setLastUpdated(isoDate) {
      if (!isoDate) return;
      const date = new Date(isoDate);
      const options = { month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('lastUpdated').textContent = date.toLocaleDateString('en-US', options);
    }

    async function fetchLastUpdate() {
      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits?per_page=1`;
        const response = await fetch(apiUrl);
        const commits = await response.json();

        if (commits.length > 0) {
          setLastUpdated(commits[0].commit.committer.date);
        }
      } catch (error) {
        console.error('Error fetching last update:', error);
      }
    }

    // ---------- rendering ----------
    function renderTagFilters() {
      const tags = [...new Set(allTools.flatMap(tool => tool.tags || []))].sort();
      if (tags.length === 0) return;

      const container = document.getElementById('tagFilters');
      container.innerHTML = ['All', ...tags].map(tag => `
                <span class="tag-chip${tag === activeTag ? ' active' : ''}" data-tag="${tag}">${tag}</span>
            `).join('');

      container.querySelectorAll('.tag-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          activeTag = chip.dataset.tag;
          container.querySelectorAll('.tag-chip').forEach(c =>
            c.classList.toggle('active', c.dataset.tag === activeTag));
          filterTools();
        });
      });
    }

    function renderTools(tools) {
      const grid = document.getElementById('toolsGrid');

      if (tools.length === 0) {
        grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No tools found</h3>
                        <p style="margin-top: 6px;">Try a different search term</p>
                    </div>
                `;
        return;
      }

      grid.innerHTML = tools.map(tool => `
                <a href="${tool.path}" class="tool-card">
                    <div class="tool-card-head">
                        <div class="tool-icon">${tool.icon}</div>
                        <div class="tool-name">${tool.name}</div>
                    </div>
                    <div class="tool-description">${tool.description}</div>
                    <div class="tool-foot">
                        <div class="tool-tags">
                            ${(tool.tags || []).map(tag => `<span class="tool-tag">${tag}</span>`).join('')}
                        </div>
                        <span class="tool-type">${tool.type}</span>
                    </div>
                </a>
            `).join('');
    }

    function renderWhatsNew() {
      const container = document.getElementById('whatsNew');
      container.innerHTML = whatsNew.slice(0, WHATS_NEW_LIMIT).map(item => {
        const date = new Date(item.date + 'T00:00:00');
        const label = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        return `
                <div class="whats-new-item">
                    <span class="whats-new-date">${label}</span>
                    <span class="whats-new-text">${item.text}</span>
                </div>`;
      }).join('');
    }

    function filterTools() {
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allTools.filter(tool =>
        (activeTag === 'All' || (tool.tags || []).includes(activeTag)) &&
        (tool.name.toLowerCase().includes(query) ||
          tool.description.toLowerCase().includes(query))
      );

      renderTools(filtered);
    }

    // Keyboard shortcut for search
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        document.getElementById('searchInput').value = '';
        filterTools();
        document.getElementById('searchInput').blur();
      }
    });

    // Initialize
    fetchTools();
    renderWhatsNew();
  </script>
</body>

</html>
