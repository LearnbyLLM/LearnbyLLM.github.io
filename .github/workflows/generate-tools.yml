name: Generate tools.json

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'scripts/generate-tools-json.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate tools.json
        run: node scripts/generate-tools-json.js

      - name: Commit if changed
        run: |
          if ! git diff --quiet tools.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools.json
            git commit -m "Regenerate tools.json"
            git push
          else
            echo "tools.json is up to date"
          fi
